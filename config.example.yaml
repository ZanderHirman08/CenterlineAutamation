# Copy to config.yaml and edit. Distances are in the units of the working CRS
# (State Plane US feet in most cases). On Windows use forward slashes in paths.

inputs:
  imagery: D:/Imagery/2024_Ortho/tiles     # folder of .tif tiles (+ .aux.xml), one .tif, or a .vrt (not .sid)
  roads: D:/Data/County_Roads.shp          # local centerlines used as the starting position
  grids: D:/Data/Mile_Grids.shp            # 1-mile work grids
  road_id_field: OBJECTID                  # unique road id, copied to the output as SRC_ID
  grid_id_field: GRID_ID

# crs: EPSG:2272          # leave out to use the imagery's CRS
# resolution: 0.5         # work at a coarser pixel size than the ortho to go faster
# grid_ids: [G101, G102]  # only process these grids (also: --grids on the command line)

bands:                    # 1-based band numbers (4-band 8-bit county ortho: R, G, B, NIR)
  red: 1
  green: 2
  blue: 3
  nir: 4                  # set to null for 3-band (RGB) imagery

classifier:
  features: pixel         # "pixel" (no GPU) or "embedding" (GPU + foundation model)
  embedding_model: facebook/dinov2-small
  embedding_device: cuda
  training_grids: 8
  samples_per_class: 20000
  # model_path: output/road_classifier.json   # reuse a trained classifier

refine:
  station_spacing: 10     # cross-section every 10 ft along each road
  search_half_width: 40   # look 40 ft either side of the existing line
  max_shift: 30           # never move a line more than this
  min_road_width: 10
  max_road_width: 60
  review_min_confidence: 0.6
  review_max_shift: 15    # flag anything moved more than this for review

output:
  folder: output
  name: aligned_centerlines
  write_shapefile: true
  write_geopackage: true
  write_stations: false     # per-cross-section QA points (big, but great for tuning)
  write_probability: false  # road-probability GeoTIFF per grid (for checking the classifier)
